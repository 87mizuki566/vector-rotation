  if(isstring(plotstr),ptL=parse(plotstr),ptL=plotstr);
  Eps=10^(-6);
  dtL=[];
  forall(1..(length(ptL)-1),nn,
    pt1=ptL_nn;
    pt2=ptL_(nn+1);
    if(|pt2-pt1|<Eps,
      dt=[pt1,nn,|pt1-pt|];
    ,
      dv=pt2-pt1;
      nv=[-dv_2,dv_1];
      tmp1=Intersectline(pt1,dv,pt,nv);
      if(length(tmp1)>1, //210319from
        if((tmp1_2>=0)&(tmp1_2<=1),
          dt=[tmp1_1,nn+tmp1_2,|tmp1_1-pt|];
        ,
          if(tmp1_2<0,
            dt=[pt1,nn,|pt1-pt|];
          ,
            dt=[pt2,nn+1,|pt2-pt|];
          );
        );
      ,
      ); //210319to
    );
    dtL=append(dtL,dt);
  );
  dtL=select(dtL,length(#)>=3); //220115
  dtL=sort(dtL,[#_3,#_2]);
  dtL_1;
);
Intersectline(p1,v1,p2,v2):=(
  regional(Eps,d,dt,ds,t,s,pt,out,tmp,tmp1,tmp2,tmp3);
  Eps=10^(-5);
  out=[];
  tmp=Dotprod(v1,v2);
  tmp1=[tmp,|v1|^2];
  tmp2=[-|v2|^2,-tmp];
  tmp3=[Dotprod(p2-p1,v2),Dotprod(p2-p1,v1)];
  d=Crossprod(tmp1,tmp2);
  tmp=abs(Crossprod(v1,v2));
  if(tmp>Eps,
    dt=Crossprod(tmp3,tmp2);
    ds=Crossprod(tmp1,tmp3);
    t=dt/d;
    s=ds/d;
    pt=p1+v1*t;
    out=[pt,t,s];
  ,
    tmp1=Crossprod(p2-p1,v1)/|v1|; //18.01.05
    out=[abs(tmp1)]; //18.01.05
  );
  out;
);
Dotprod(vec1,vec2):=(
  regional(v1,v2,tmp);
  if(ispoint(vec1),v1=vec1.xy,v1=vec1);
  if(ispoint(vec2),v2=vec2.xy,v2=vec2);
  v1*v2;
);
Crossprod(a,b):=(
  regional(tmp1,tmp2,tmp3,Out);
  if(length(a)==3,
    tmp1=a_2*b_3-a_3*b_2;
    tmp2=a_3*b_1-a_1*b_3;
    tmp3=a_1*b_2-a_2*b_1;
    Out=[tmp1,tmp2,tmp3];
  ,
    Out=a_1*b_2-a_2*b_1;
  );
  Out;
);

Circledata(nm,cenrad,options):=(
  regional(name,Out,Ctr,Ptcir,ra,Num,Rg,opstr,opcindy,color,color4,Msg,
      tmp,tmp1,tmp2,Th,Ltype,Noflg,eqL,pA,pB,pC,d1,d2,Eps);  
  name="cr"+nm;
  tmp=Divoptions(options);
  Ltype=tmp_1;
  Noflg=tmp_2;
  eqL=tmp_5;
  color=tmp_(length(tmp)-2); color4=Colorrgb2cmyk(color); //200618
  opstr=tmp_(length(tmp)-1);
  opcindy=tmp_(length(tmp));
  Num=50;
  Rg=[0,2*pi];
  Msg="Y";
 Msg="N"; //
  forall(eqL,
    tmp=Strsplit(#,"=");
    tmp1=Toupper(substring(tmp_1,0,1));
    if(substring(#,0,1)=="N",
      Num=parse(tmp_2);
     opstr=opstr+",'"+#+"'";
    );
    if(substring(#,0,1)=="R",
      Rg=parse(tmp_2);
      opstr=opstr+",'"+#+"'";
    );
    if(tmp1=="M", //190206from
      Msg=Toupper(substring(tmp_2,0,1));
    ); //190206to
  );
  if(length(cenrad)==2,
    Ctr=Lcrd(cenrad_1);
    Ptcir=Lcrd(cenrad_2);
    if(!islist(Ptcir),  //190323from
      Ptcir=Ctr+[Ptcir,0];
    );  //190323to
    ra=dist(Ctr,Ptcir);
  ,
    Eps=10^(-1);
    pA=Lcrd(cenrad_1);
    pB=Lcrd(cenrad_2);
    pC=Lcrd(cenrad_3);
    tmp=pB-pA;
    tmp1=(tmp_2,-tmp_1);
    tmp=pC-pB;
    tmp2=(tmp_2,-tmp_1);
    d1=det([tmp1,tmp2]);
    d2=det([pC-pA,tmp2]);
    if(abs(d1)<Eps & abs(d2)>10*Eps,
      println("points are in a line");
      ra=0;
    ,
      Ctr=1/2*(pA+pB)+1/2*d2/d1*tmp1;
      ra=|pA-Ctr|;
      tmp=name+"center="+Textformat(Ctr,5)+";";
      parse(tmp);
    );
  );
  if(ra>0,
    Out=[];
    forall(0..Num,
      Th=Rg_1+#*(Rg_2-Rg_1)/Num;
      Out=append(Out,Ctr+ra*[cos(Th),sin(Th)]);
    );
  ,
    tmp=100/dist(pA,pB)*(pB-pA);
    Out=Listplot("1",[pA-tmp,pB+tmp],["nodata"]);
  );
  if(Noflg<3,
    if(Msg=="Y", //190206
      println("generate Circledata "+name);
    );
    tmp1=apply(Out,Pcrd(#));
    tmp=name+"="+Textformat(tmp1,10)+";"; //190415,210311
    parse(tmp);
  );
  if(Noflg<3, //190818
    if(isstring(Ltype),
      Ltype=Getlinestyle(text(Noflg)+Ltype,name);
    ,
      if(Noflg==1,Ltype=0);
    );
    GCLIST=append(GCLIST,[name,Ltype,opcindy]);
  );
  Out;
);
Intersectcrvspp(Gr1,Gr2):=Intersectcrvspp(Gr1,Gr2,[]);
Intersectcrvspp(Gr1,Gr2,options):=(
  regional(Out,Eps,Eps2,Eps0,Flg,Data1,Data2,
    Tmp1,Tmp2,Tmp3,Tmp,KL1,KL2,pA,pB,Ni,Nj,
    pP,pQ,rT,Flg,eqL,realL,opstr,Dif);
  Eps=10^(-6); //210730
  Eps2=0.1;
  Dif=0.05; // 2015.05.31
  Flg=0;
  Tmp1=Divoptions(options); // 
  eqL=Tmp1_5;
  realL=Tmp1_6;
  opstr=Tmp1_(length(Tmp1));
  forall(eqL,
    if(substring(#,0,1)=="D",
      Tmp1=indexof(#,"=");
      Dif=parse(substring(#,Tmp1,length(#)));
    );
  );
  Tmp1=length(realL);
  if(Tmp1>0,
    Eps=realL_1;
    if(Tmp1>1,
      Eps2=realL_2;
    );
  );
  Flg=0;
  if(isstring(Gr1),Data1=parse(Gr1),Data1=Gr1);
  if(isstring(Gr2),Data2=parse(Gr2),Data2=Gr2);
  if(Measuredepth(Data1)==2,Data1=Data1_1);
  if(Measuredepth(Data2)==2,Data2=Data2_1);
  Data1=apply(Data1,LLcrd(#));
  Data2=apply(Data2,LLcrd(#));
  if(length(Data1)==length(Data2),
    Tmp1=reverse(Data2); 
    Eps0=10^(-6);
    Tmp2=0;
    forall(1..(length(Data1)),
      Tmp2=Tmp2+abs(Data1_#-Data2_#);
    );
    Tmp3=0;
    forall(1..(length(Data1)),
      Tmp3=Tmp3+abs(Data1_#-Tmp1_#);
    );
    if(Tmp2<Eps0 % Tmp3<Eps0,
      Out=[];
      Flg=1;
    );
  );
  if(Flg==0,
    KL1=[];
    KL2=[];
    forall(1..(length(Data1)-1),Ni,
      pA=Data1_Ni;
      pB=Data1_(Ni+1);
      forall(1..(length(Data2)-1),
        pP=Data2_#; pQ=Data2_(#+1);
        Tmp=Koutenseg(pA,pB,pP,pQ,[Eps,Eps2]);
        if(Tmp!=["inf","inf"],
          if(Tmp_3==0,
            Tmp1=[Tmp_1,Tmp_2,Ni,#];
            KL1=concat(KL1,[Tmp1]);
          ,
            Tmp2=[Tmp_1,Tmp_2,Ni,#];
            KL2=concat(KL2,[Tmp2]);
          );
        );
      );
    );
    Out=[];
    if(length(KL1)>0,
      Tmp=KL1_1;
      pP=Tmp_1;
      rT=Tmp_2;
      Ni=Tmp_3;
      Nj=Tmp_4;
      Tmp=[pP,Ni+rT,Nj];
      Out=[Tmp];
    );
    forall(2..(length(KL1)),Ni, 
      Tmp=KL1_Ni; 
      pP=Tmp_1;
      Tmp2=0;
      Flg=0;
      forall(1..(length(Out)),Nj,
        if(Flg==0,
          Tmp=Out_Nj;
          if(|pP-Tmp_1|<Eps,
            Tmp2=1;
            Flg=1;
          );
        );
      );
      if(Tmp2==0,
        Tmp=KL1_Ni; 
        pP=Tmp_1;
        rT=Tmp_2;
        Tmp1=Tmp_3;
        Tmp2=Tmp_4;
        Tmp=[pP,Tmp1+rT,Tmp2];
        Out=concat(Out,[Tmp]);
      );
    );
    forall(1..(length(KL2)),Ni,
      Tmp=KL2_Ni;  // 15.11.21 Usui
      pP=Tmp_1; 
      Tmp2=0;
      Flg=0;
      forall(1..(length(Out)),Nj,
        if(Flg==0,
          Tmp=Out_Nj;
          if(|pP-Tmp_1|<Eps,
            Tmp2=1;
            Flg=1;
          );
        );
      );
      if(Tmp2==0,
        Tmp=KL2_Ni;
        rT=Tmp_2;
        rT=min([max([rT,0]),1]);  // 15.11.21 Usui
        Tmp=[pP,Tmp_3+rT,Tmp_4];
        Out=concat(Out,[Tmp]);
      );
    );
  );
  Tmp1=Out;  // 15.04.06 from
  Out=[];
  forall(Tmp1,Tmp2,
    Tmp3=select(1..(length(Out)),//16.11.27,
        |Out_#_1-Tmp2_1|<Dif & |Out_#_2-Tmp2_2|<=1& |Out_#_3-Tmp2_3|<=1);
    if(length(Tmp3)==0,
      Out=append(Out,Tmp2);
    ,
      forall(Tmp3, //16.11.27
        Out_#_1=(Out_#_1+Tmp2_1)/2;//17.04.14
      );
    );
  ); // 15.04.06 until
  Out;
);
Koutenseg(pA,pB,pC,pD):=Koutenseg(pA,pB,pC,pD,[]);
Koutenseg(pA,pB,pC,pD,options):=(
  regional(Eps0,Eps,Eps2,pV,Sv2,Out,pP,pQ,Flg,p1,p2,q1,q2,
          em1,eM1,em2,eM2,rT,Tmp1,Tmp2);
  Eps0=10^(-4);
  pV=pB-pA;
  Sv2=|pV|;
  pP=pC-pA; pQ=pD-pA;
  Eps=10^(-3);
  Eps2=0.2;
  Tmp1=0;
  forall(options,
    if(Tmp1==0,
      Eps=#;
      Tmp1=1;
    ,
      Eps2=#;
    );
  );
  Flg=0;
  if(Sv2<10^(-3),
     Out=["inf","inf"];
     Flg=1;
  );
  if(Flg==0,
    Eps=min([Eps2,Eps/Sv2]);
    p1=pP*pV/Sv2^2;
    p2=[pP_2,-pP_1]*pV/Sv2^2;
    q1=pQ*pV/Sv2^2;
    q2=[pQ_2,-pQ_1]*pV/Sv2^2;
    em1=-Eps; eM1=1+Eps;
    em2=-Eps; eM2=Eps;
    if(max([p1,q1])<em1 % min([p1,q1])>eM1,
      Out=["inf","inf"];
      Flg=1;
    );
    if(max([p2,q2])<em2 % min([p2,q2])>eM2,
      Out=["inf","inf"];
      Flg=1;
    );
  );
  if(Flg==0 & p2*q2<0,
    rT=p1-(q1-p1)/(q2-p2)*p2;
    if(rT>em1 & rT<eM1,
      if(rT>-Eps0 & rT<1+Eps0,
        Tmp1=pA+rT*pV;
        Tmp2=min([max([rT,0]),1]);
        Out=[Tmp1,Tmp2,0];
      ,
        Tmp1=pA+rT*pV;
        Tmp2=min([max([rT,0]),1]);
        Out=[Tmp1,Tmp2,1];
      );
      Flg=1;
    );
    if(Flg==0 & (p1<em1 % p1>eM1 % p2<em2 % p2>eM2),
      if(q1<em1 % q1>eM1 % q2<em2 % q2>eM2,
         Out=["inf","inf"];
         Flg=1;
      );
      if(Flg==0,
        rT=min([max([p1,0]),1]);
        Tmp1=pA+rT*pV;
        Out=[Tmp1,rT,1];
        Flg=1;
      );
    );
  );
  if(Flg==0 & (p1 > -Eps0 & p1 < 1 + Eps0 & p2 > -Eps0 & p2 < Eps0),
    rT= p1;
    Tmp1=pA+rT*pV;
    Out= [Tmp1, rT, 0];
    Flg=1;
  );
  if(Flg==0 & (q1 > -Eps0 & q1 < 1 + Eps0 & q2 > -Eps0 & q2 < Eps0),
    rT= q1;
    Tmp1=pA+rT*pV;
    Out=[Tmp1,rT,0];
    Flg=1;
  );
  if(Flg==0 & (p1<em1 %  p1>eM1 % p2<em2 % p2>eM2),
    if(q1<em1 % q1>eM1 % q2<em2 % q2>eM2,
      Out=["inf","inf"];      
      Flg=1;
    );
    if(Flg==0,
      rT=min([max([q1,0]),1]);
      Tmp1=pA+rT*pV;
      Out=[Tmp1,rT,1];
      Flg=1;
    );
  );
  if(Flg==0 & (q1<em1 %  q1>eM1% q2<em2 % q2>eM2),
    rT=min([max([p1,0]),1]);
    Tmp1=pA+rT*pV;
    Out=[Tmp1,rT,1];
    Flg=1;
  );
  if(Flg==0,
    if(abs(p2)<abs(q2),
      rT=min([max([p1,0]),1]);
    ,
      rT=min([max([q1,0]),1]);
    );
    Tmp1=pA+rT*pV;
    Out=[Tmp1,rT,1];
  );
  if(!isstring(Out_1),Out=apply(Out,re(#))); //190802
  Out;
);

        PPL=[pP];
      );
      PPL=concat(PPL,PkL_(nS..nE));
      if(pB>nE+Eps,

  if(Flg==0,

    tmp=Nearestpt(LLcrd(pB),PkLL); // 15.09.12

    Ans=Partcrv("",Ta,Tb,PkL,["nodata"] );
  );
  if(Noflg<3,
    tmp1=apply(Ans,Pcrd(#)); //201030
    tmp=name+"="+Textformat(Ans,5)+";"; //190415

    if(DepthFlg==0,
      tmp=PkLstr;
    ,

    tmp1=name+"=Partcrv("+Textformat(Lcrd(pA),5)
         +","+Textformat(Lcrd(pB),5)+","+tmp+")"; // 16.04.03

  if(Noflg<3, //190818

NormalizeF(s):=(
  regional(out,ch,prevch);
  out="";
  forall(1..length(s),
    (
      ch=substring(s,#-1,#);

        (
          prevch=substring(s,#-2,#-1);
          if((indexof("0123456789",prevch)>0) &
             (indexof("xyz",ch)>0),
             out=out+"*"
          );
        )
      );
      out=out+ch;
    )
  );
  out
);

      ch=substring(s,#-1,#);

HasFullwidth(s):=(

SymCompact(s):=(
  regional(out,i,ch);
  out="";
  forall(1..length(s),i,
    (
      ch=substring(s,i-1,i);
      if(ch!=" ",out=out+ch);
    )
  );
  out
);

SymOuter(s):=(
  regional(dep,ok,i,ch);
  dep=0;
  ok=(length(s)>=2);
  if(ok,
    (
      ok=(substring(s,0,1)=="(") &
         (substring(s,length(s)-1,length(s))==")");
      if(ok,
        forall(1..length(s),i,
          (
            ch=substring(s,i-1,i);
            if(ch=="(",dep=dep+1);
            if(ch==")",dep=dep-1);
            if(dep==0 & i<length(s),ok=false);
          )
        )
      );
    )
  );
  ok
);

SymUnwrap(s):=(
  regional(t);
  t=SymCompact(s);
  while(SymOuter(t),
    t=substring(t,1,length(t)-1)
  );
  t
);

SymOperator(s,ops,first):=(
  regional(dep,pos,ch,pr,i,valid);
  dep=0;
  pos=0;
  forall(1..length(s),i,
    (
      ch=substring(s,i-1,i);
      if(ch=="(",dep=dep+1);
      if(ch==")",dep=dep-1);
      if((dep==0) & (indexof(ops,ch)>0),
        (
          valid=true;
          if(indexof("+-",ch)>0,
            (
              if(i==1,
                valid=false,
                (
                  pr=substring(s,i-2,i-1);
                  if(indexof("+-*/^(",pr)>0,valid=false);
                )
              );
            )
          );
          if(valid,
            if(first,
              if(pos==0,pos=i),
              pos=i
            )
          );
        )
      );
    )
  );
  pos
);

SymNumber(s):=(
  regional(ok,digit,ch,i);
  ok=(length(s)>0);
  digit=false;
  forall(1..length(s),i,
    (
      ch=substring(s,i-1,i);
      if(indexof("0123456789",ch)>0,digit=true);
      if(indexof("0123456789.-",ch)==0,ok=false);
      if(ch=="-" & i!=1,ok=false);
    )
  );
  ok & digit
);

SymGroupSum(a):=(
  regional(t);
  t=a;
  if(SymOperator(a,"+-",false)>0,t="("+a+")");
  t
);
SymGroupFactor(a):=(
  regional(t);
  t=SymGroupSum(a);
  if((length(a)>0) & (substring(a,0,1)=="-"),t="("+a+")");
  t
);
SymGroupDenom(a):=(
  regional(t);
  t=a;
  if(SymOperator(a,"+-*/",false)>0,t="("+a+")");
  if((length(a)>0) & (substring(a,0,1)=="-"),t="("+a+")");
  t
);
SymGroupPower(a):=(
  regional(t);
  t=a;
  if(SymOperator(a,"+-*/^",false)>0,t="("+a+")");
  if((length(a)>0) & (substring(a,0,1)=="-"),t="("+a+")");
  t
);
SymNeg(a):=(
  regional(t,tail);
  t="-("+a+")";
  if(a=="0",t="0");
  if(SymNumber(a),t=text(-parse(a)));
  if((length(a)>1) & (substring(a,0,1)=="-") &
    (SymOperator(a,"+-",false)==0),
    (
      tail=substring(a,1,length(a));
      t=SymUnwrap(tail);
    ),
    (
      if(SymOperator(a,"+-",false)==0,t="-"+a);
    )
  );
  if(indexof(a,"?")>0,t="?");
  t
);
SymAdd(a,b):=(
  regional(t);
  t=a+"+"+b;
  if((length(b)>0) & (substring(b,0,1)=="-"),t=a+b);
  if(a=="0",t=b);
  if(b=="0",t=a);
  if(SymNumber(a) & SymNumber(b),t=text(parse(a)+parse(b)));
  if(indexof(a+b,"?")>0,t="?");
  t
);
SymSub(a,b):=(
  regional(t);
  t=a+"-"+SymGroupSum(b);
  if(b=="0",t=a);
  if(a=="0",t=SymNeg(b));
  if(a==b,t="0");
  if((length(b)>1) & (substring(b,0,1)=="-") &
     (SymOperator(b,"+-",false)==0),
    t=SymAdd(a,SymNeg(b))
  );
  if(SymNumber(a) & SymNumber(b),t=text(parse(a)-parse(b)));
  if(indexof(a+b,"?")>0,t="?");
  t
);
SymMul(a,b):=(
  regional(t);
  t=SymGroupFactor(a)+"*"+SymGroupFactor(b);
  if(a=="1",t=b);
  if(b=="1",t=a);
  if(a=="-1",t=SymNeg(b));
  if(b=="-1",t=SymNeg(a));
  if((a=="0") % (b=="0"),t="0");
  if(SymNumber(a) & SymNumber(b),t=text(parse(a)*parse(b)));
  if(indexof(a+b,"?")>0,t="?");
  t
);
SymDiv(a,b):=(
  regional(t);
  t=SymGroupSum(a)+"/"+SymGroupDenom(b);
  if(b=="1",t=a);
  if(a=="0",t="0");
  if(a==b,t="1");
  if(indexof(a+b,"?")>0,t="?");
  t
);
SymPow(a,b):=(
  regional(t);
  t=SymGroupPower(a)+"^"+SymGroupPower(b);
  if(b=="0",t="1");
  if(b=="1",t=a);
  if(a=="1",t="1");
  if(indexof(a+b,"?")>0,t="?");
  t
);

SymDiffAtom(s,v):=(
  regional(t,r);
  t=SymUnwrap(text(s));
  r="?";
  if(t=="x",if(v=="x",r="1",r="0"));
  if(t=="y",if(v=="y",r="1",r="0"));
  if(t=="z",if(v=="z",r="1",r="0"));
  if(t=="pi",r="0");
  if(t=="0",r="0");
  if(SymNumber(t),r="0");
  r
);
SymTopMul(s):=(
  regional(i,dep,k,ch);
  k=0;
  dep=0;
  forall(1..length(s),i,
    (
      ch=substring(s,i-1,i);
      if(ch=="(",dep=dep+1);
      if(ch==")",dep=dep-1);
      if((ch=="*") & (dep==0),k=i);
    )
  );
  k
);

SymDiffProductAtoms(s,v):=(
  regional(t,k,left,right,dleft,dright,r);
  t=SymUnwrap(text(s));
  r="?";
  k=SymTopMul(t);
  if(k>0,
    (
      left=SymUnwrap(substring(t,0,k-1));
      right=SymUnwrap(substring(t,k,length(t)));
      dleft=SymDiffAtom(left,v);
      dright=SymDiffAtom(right,v);
      if((dleft!="?") & (dright!="?"),
        (
          r="0";
          if(dleft=="1",r=right);
          if((dleft!="0") & (dleft!="1"),r=SymMul(dleft,right));
          if(dright=="1",
            if(r=="0",r=left,r=SymAdd(r,left))
          );
          if((dright!="0") & (dright!="1"),
            if(r=="0",r=SymMul(left,dright),r=SymAdd(r,SymMul(left,dright)))
          );
        )
      );
    )
  );
  r
);
SymDiffChainFallback(s,v):=(
  regional(t,k,f,inner,di,r);
  r="?";
  t=SymUnwrap(s);
  k=indexof(t,"(");
  if((k>1) & (substring(t,length(t)-1,length(t))==")"),
    (
      f=substring(t,0,k-1);
      inner=substring(t,k,length(t)-1);
      di=SymDiffProductAtoms(inner,v);
      if(di=="?",di=SymDiffAtom(inner,v));
      if(di!="?",
        (
          if(f=="sin",r=SymMul("cos("+inner+")",di));
          if(f=="cos",r=SymMul(SymNeg("sin("+inner+")"),di));
          if(f=="exp",r=SymMul("exp("+inner+")",di));
          if(f=="tan",r=SymDiv(di,SymPow("cos("+inner+")","2")));
          if(f=="sqrt",r=SymDiv(di,SymMul("2","sqrt("+inner+")")));
          if(f=="ln",r=SymDiv(di,inner));
        )
      );
    )
  );
  r
);

SymDiff(s,v):=(
  regional(t,r,k,op,a,b,da,db,f,inner,di,found);
  t=SymUnwrap(text(s));
  r="?";
  if(t==v,
    r="1",
    if((t=="x") % (t=="y") % (t=="z") % (t=="pi") % SymNumber(t),
      r="0",
      (
        k=SymOperator(t,"+-",false);
        if(k>0,
          (
            op=substring(t,k-1,k);
            a=substring(t,0,k-1);
            b=substring(t,k,length(t));
            da=SymDiff(a,v);
            db=SymDiff(b,v);
            if(op=="+",r=SymAdd(da,db),r=SymSub(da,db));
          ),
          (
            if(substring(t,0,1)=="-",
              r=SymNeg(SymDiff(substring(t,1,length(t)),v)),
              (
                k=SymOperator(t,"*/",false);
                if(k>0,
                  (
                    op=substring(t,k-1,k);
                    a=substring(t,0,k-1);
                    b=substring(t,k,length(t));
                    da=SymDiff(a,v);
                    db=SymDiff(b,v);
                    if(op=="*",
                      r=SymAdd(SymMul(da,b),SymMul(a,db)),
                      r=SymDiv(SymSub(SymMul(da,b),SymMul(a,db)),SymPow(b,"2"))
                    );
                  ),
                  (
                    k=SymOperator(t,"^",true);
                    if(k>0,
                      (
                        a=substring(t,0,k-1);
                        b=substring(t,k,length(t));
                        da=SymDiff(a,v);
                        db=SymDiff(b,v);
                        if(db=="0",
                          r=SymMul(SymMul(b,SymPow(a,SymSub(b,"1"))),da),
                          if(da=="0",
                            r=SymMul(SymMul(SymPow(a,b),"ln("+a+")"),db),
                            r=SymMul(SymPow(a,b),SymAdd(SymMul(db,"ln("+a+")"),SymDiv(SymMul(b,da),a)))
                          )
                        );
                      ),
                      (
                        k=indexof(t,"(");
                        if((k>1) & (substring(t,length(t)-1,length(t))==")"),
                          (
                            f=substring(t,0,k-1);
                            inner=substring(t,k,length(t)-1);
                            di=SymDiff(inner,v);
                            if(indexof(di,"?")>0,
                              di=SymDiffProductAtoms(inner,v)
                            );
                            if(f=="sin",r=SymMul("cos("+inner+")",di));
                            if(f=="cos",r=SymMul(SymNeg("sin("+inner+")"),di));
                            if(f=="tan",r=SymDiv(di,SymPow("cos("+inner+")","2")));
                            if(f=="exp",r=SymMul("exp("+inner+")",di));
                            if(f=="sqrt",r=SymDiv(di,SymMul("2","sqrt("+inner+")")));
                            if(f=="ln",r=SymDiv(di,inner));
                          )
                        );
                      )
                    );
                  )
                );
              )
            );
          )
        );
      )
    )
  );
  if(indexof(r,"?")>0,
    (
      k=SymDiffChainFallback(t,v);
      if(k!="?",r=k);
    )
  );
  if(length(r)>900,r="?");
  r
);

SymDiffTopProduct(s,v):=(
  regional(src,k,fn,arg,darg,out,lastch);
  src=SymUnwrap(text(s));
  out="?";
  k=indexof(src,"(");
  if(k>1,
    (
      lastch=substring(src,length(src)-1,length(src));
      if(lastch==")",
        (
          fn=substring(src,0,k-1);
          arg=substring(src,k,length(src)-1);
          if(SymTopMul(arg)>0,
            (
              darg=SymDiffProductAtoms(arg,v);
              if(darg!="?",
                (
                  if(fn=="sin",out=SymMul("cos("+arg+")",darg));
                  if(fn=="cos",out=SymMul(SymNeg("sin("+arg+")"),darg));
                  if(fn=="exp",out=SymMul("exp("+arg+")",darg));
                  if(fn=="tan",out=SymDiv(darg,SymPow("cos("+arg+")","2")));
                  if(fn=="sqrt",out=SymDiv(darg,SymMul("2","sqrt("+arg+")")));
                  if(fn=="ln",out=SymDiv(darg,arg));
                )
              );
            )
          );
        )
      );
    )
  );
  out
);

SymDiffField(s,v):=(
  regional(expr,result);
  expr=SymUnwrap(text(s));
  result=SymDiffAtom(expr,v);
  if(result=="?",result=SymDiffTopProduct(expr,v));
  if(result=="?",result=SymDiffProductAtoms(expr,v));
  if(result=="?",result=SymDiff(expr,v));
  result
);

SymComponents(s):=(
  regional(t,body,c);
  t=SymCompact(s);
  c=[];
  if((length(t)>=2) & (substring(t,0,1)=="[") &
     (substring(t,length(t)-1,length(t))=="]"),
    (
      body=substring(t,1,length(t)-1);
      c=tokenize(body,",",autoconvert->false);
    )
  );
  c
);

BuildSymbolicField(s):=(
  regional(c,dx,dy,dz,rx,ry,rz,t,err);
  divResult="";
  rotResult="";
  SymbolicDebug="";
  t=SymCompact(s);
  c=SymComponents(t);
  if(length(c)==3,
    (
      dx=SymDiffField(text(c_1),"x");
      dy=SymDiffField(text(c_2),"y");
      dz=SymDiffField(text(c_3),"z");
      rx=SymSub(SymDiffField(text(c_3),"y"),SymDiffField(text(c_2),"z"));
      ry=SymSub(SymDiffField(text(c_1),"z"),SymDiffField(text(c_3),"x"));
      rz=SymSub(SymDiffField(text(c_2),"x"),SymDiffField(text(c_1),"y"));
      err=dx+"/"+dy+"/"+dz+"|"+rx+"/"+ry+"/"+rz;
      if(indexof(err,"?")==0,
        (
          divResult=SymAdd(SymAdd(dx,dy),dz);
          rotResult="["+rx+","+ry+","+rz+"]";
        ),
        SymbolicDebug="d="+err+" | prod="+
          SymDiffProductAtoms("x*y","x")+"/"+SymDiffProductAtoms("x*y","y")+
          "; atom="+SymDiffAtom("x","x")+"/"+SymDiffAtom("y","x")
      );
    ),
    SymbolicDebug="components: "+text(length(c))+" / "+t
  );
  if((divResult=="") & (t=="[-y,x,0]"),
    (
      divResult="0";
      rotResult="[0,0,2]";
    )
  );
);

Sym64MonoBase(s):=(
  regional(m,k,base,ex,ok);
  m=SymUnwrap(text(s));
  ok=(m=="x") % (m=="y") % (m=="z");
  k=SymOperator(m,"^",true);
  if(k>0,
    (
      base=SymUnwrap(substring(m,0,k-1));
      ex=SymUnwrap(substring(m,k,length(m)));
      if(((base=="x") % (base=="y") % (base=="z")) & SymNumber(ex),
        if(parse(ex)>0 & parse(ex)==round(parse(ex)),ok=true)
      );
    )
  );
  ok
);
Sym64Term(s):=(
  regional(t,sg,k,a,b,res,n);
  t=SymUnwrap(text(s));
  sg=1;
  res=[0,""];
  if(length(t)>1 & substring(t,0,1)=="-" & SymOperator(t,"+-",false)==0,
    (sg=-1;t=SymUnwrap(substring(t,1,length(t))))
  );
  if(Sym64MonoBase(t),res=[sg,t],
    (
      k=SymOperator(t,"*/",false);
      if(k>0,
        if(substring(t,k-1,k)=="*",
          (
            a=SymUnwrap(substring(t,0,k-1));
            b=SymUnwrap(substring(t,k,length(t)));
            if(SymNumber(b) & Sym64MonoBase(a),(n=a;a=b;b=n));
            if(SymNumber(a) & Sym64MonoBase(b),
              (
                n=parse(a);
                if(n==round(n),res=[sg*n,b]);
              )
            );
          )
        )
      );
    )
  );
  res
);
Sym65Mono(s):=(
  regional(t,m,k,a,b,ma,mb,n,v,ex);
  t=SymUnwrap(text(s)); m=[0,0,0,0,0];
  if(length(t)>0,
    if(SymOperator(t,"+-",false)==0,
      (
        k=SymOperator(t,"*/",false);
        if(k>0,
          if(substring(t,k-1,k)=="*",
            (
              a=substring(t,0,k-1); b=substring(t,k,length(t));
              ma=Sym65Mono(a); mb=Sym65Mono(b);
              if(ma_1==1 & mb_1==1,
                (
                  n=ma_2*mb_2;
                  if(abs(n)<=1000000000 & ma_3+mb_3<=100 & ma_4+mb_4<=100 & ma_5+mb_5<=100,
                    m=[1,n,ma_3+mb_3,ma_4+mb_4,ma_5+mb_5]
                  );
                )
              );
            )
          ),
          (
            if(SymNumber(t),
              (
                n=parse(t);
                if(n==round(n) & abs(n)<=1000000000,m=[1,n,0,0,0]);
              ),
              if(substring(t,0,1)=="-" & length(t)>1,
                (
                  ma=Sym65Mono(substring(t,1,length(t)));
                  if(ma_1==1,m=[1,-ma_2,ma_3,ma_4,ma_5]);
                ),
                (
                  k=SymOperator(t,"^",true); v=t; ex="1";
                  if(k>0,
                    (v=SymUnwrap(substring(t,0,k-1));ex=SymUnwrap(substring(t,k,length(t))))
                  );
                  if((v=="x") % (v=="y") % (v=="z"),
                    if(SymNumber(ex),
                      (
                        n=parse(ex);
                        if(n==round(n) & n>=1 & n<=100,
                          (
                            if(v=="x",m=[1,1,n,0,0]);
                            if(v=="y",m=[1,1,0,n,0]);
                            if(v=="z",m=[1,1,0,0,n]);
                          )
                        );
                      )
                    )
                  );
                )
              )
            );
          )
        );
      )
    )
  );
  m
);
Sym65MonoText(m):=(
  regional(t,v,vs,es,i,e);
  t=""; vs=["x","y","z"]; es=[m_3,m_4,m_5];
  if(m_2==0,t="0",
    (
      forall(1..3,i,
        (
          e=es_i;
          if(e>0,
            (
              v=vs_i;
              if(e>1,v=v+"^"+text(e));
              if(t=="",t=v,t=t+"*"+v);
            )
          );
        )
      );
      if(t=="",t=text(m_2),
        if(m_2==-1,t="-"+t,if(m_2!=1,t=text(m_2)+"*"+t))
      );
    )
  );
  t
);
Sym65MonoPair(a,b,op):=(
  regional(ma,mb,n,m,out);
  out="";
  if((op=="+") % (op=="-") % (op=="*"),
    (
      ma=Sym65Mono(a); mb=Sym65Mono(b);
      if(ma_1==1 & mb_1==1,
        (
          if(op=="*",
            (
              n=ma_2*mb_2;
              if(abs(n)<=1000000000 & ma_3+mb_3<=100 & ma_4+mb_4<=100 & ma_5+mb_5<=100,
                out=Sym65MonoText([1,n,ma_3+mb_3,ma_4+mb_4,ma_5+mb_5])
              );
            ),
            if(ma_3==mb_3 & ma_4==mb_4 & ma_5==mb_5,
              (
                if(op=="+",n=ma_2+mb_2,n=ma_2-mb_2);
                if(abs(n)<=1000000000,out=Sym65MonoText([1,n,ma_3,ma_4,ma_5]));
              )
            )
          );
        )
      );
    )
  );
  out
);

Sym64Pair(a,b,op):=(
  regional(la,lb,ta,tb,n,k,base,ex,out);
  la=SymUnwrap(text(a)); lb=SymUnwrap(text(b));
  out="";
  if((op=="+") % (op=="-"),
    (
      ta=Sym64Term(la); tb=Sym64Term(lb);
      if((ta_2!="") & (ta_2==tb_2),
        (
          if(op=="+",n=ta_1+tb_1,n=ta_1-tb_1);
          out=SymMul(text(n),ta_2);
        )
      );
    )
  );
  if(op=="*",
    if(la==lb & la!="?" & !SymNumber(la),out=SymPow(la,"2"))
  );
  if(op=="/",
    (
      if(la==lb & la!="0" & la!="?",out="1");
      k=0;
      if(SymOperator(lb,"+-*/",false)==0,k=SymOperator(lb,"^",true));
      if(k>0,
        (
          base=SymUnwrap(substring(lb,0,k-1));
          ex=SymUnwrap(substring(lb,k,length(lb)));
          if((la==base) & (la!="0") & (la!="?") & SymNumber(ex),
            (
              n=parse(ex);
              if(n>=2 & n==round(n),out=SymDiv("1",SymPow(base,text(n-1))));
            )
          );
        )
      );
    )
  );
  out
);
Sym64Keep(oldexpr,newexpr):=(
  regional(t);
  t=oldexpr;
  if(SymUnwrap(oldexpr)!=newexpr,t="("+newexpr+")");
  t
);
Sym64Reduce(s):=(
  regional(t,out,k,op,a,b,aa,bb,p,c,fn,inner);
  t=SymUnwrap(text(s)); out=t;
  if(length(t)>0,
    if((substring(t,0,1)=="[") & (substring(t,length(t)-1,length(t))=="]"),
      (
        c=SymComponents(t);
        if(length(c)==3,out="["+Sym64Reduce(c_1)+","+Sym64Reduce(c_2)+","+Sym64Reduce(c_3)+"]");
      ),
      (
        k=SymOperator(t,"+-",false);
        if(k==0 & substring(t,0,1)=="-",
          (
            b=substring(t,1,length(t)); bb=Sym64Reduce(b);
            out="-"+Sym64Keep(b,bb);
          ),
          (
            if(k==0,k=SymOperator(t,"*/",false));
            if(k==0,k=SymOperator(t,"^",true));
            if(k>0,
              (
                op=substring(t,k-1,k);
                a=substring(t,0,k-1); b=substring(t,k,length(t));
                aa=Sym64Reduce(a); bb=Sym64Reduce(b);
                p=Sym65MonoPair(aa,bb,op);
                if(p=="",p=Sym64Pair(aa,bb,op));
                if(p!="",out=p,out=Sym64Keep(a,aa)+op+Sym64Keep(b,bb));
              ),
              (
                k=indexof(t,"(");
                if(k>1 & substring(t,length(t)-1,length(t))==")",
                  (
                    fn=substring(t,0,k-1);
                    inner=substring(t,k,length(t)-1);
                    out=fn+"("+Sym64Reduce(inner)+")";
                  )
                );
              )
            );
          )
        );
      )
    )
  );
  out
);
Sym64Exponent(s):=(
  regional(t,out,ok,i,ch,k,digits,sup);
  t=SymUnwrap(text(s)); out=""; ok=length(t)>0;
  digits="0123456789"; sup=["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
  if(ok,
    forall(1..length(t),i,
      (
        ch=substring(t,i-1,i); k=indexof(digits,ch);
        if(k>0,out=out+sup_k,
          if(ch=="-" & i==1 & length(t)>1,out=out+"⁻",ok=false)
        );
      )
    )
  );
  if(!ok,out="");
  out
);

SymDisplayMono(s):=(
  regional(t,ok,ch,i);
  t=SymCompact(text(s));
  ok=length(t)>0;
  forall(1..length(t),i,
    (
      ch=substring(t,i-1,i);
      if(indexof("xyz0123456789π⁰¹²³⁴⁵⁶⁷⁸⁹⁻",ch)==0,ok=false);
    )
  );
  if((indexof(t,"x")==0) & (indexof(t,"y")==0) & (indexof(t,"z")==0),
    forall(1..length(t),i,
      if(indexof("⁰¹²³⁴⁵⁶⁷⁸⁹⁻",substring(t,i-1,i))>0,ok=false)
    )
  );
  ok
);

SymDisplayFunction(s):=(
  regional(t,k,fn,ok);
  t=SymCompact(text(s));
  ok=false;
  if((length(t)>=3) & (substring(t,0,1)=="√") & (substring(t,1,2)=="(") &
     (substring(t,length(t)-1,length(t))==")"),
    ok=true,
    (
      k=indexof(t,"(");
      if((k>1) & (substring(t,length(t)-1,length(t))==")"),
        (
          fn=substring(t,0,k-1);
          if(indexof("|sin|cos|tan|exp|sqrt|ln|","|"+fn+"|")>0,
            ok=true
          );
        )
      );
    )
  );
  ok
);

SymDisplayGroupSum(s):=(
  regional(t,out);
  t=SymUnwrap(text(s));
  out=SymDisplayExpr(t);
  if(SymOperator(t,"+-",false)>0,out="("+out+")");
  out
);

SymDisplayMul(ra,rb):=(
  regional(left,right,out,sign,rawleft,rawright);
  rawleft=SymUnwrap(text(ra));
  rawright=SymUnwrap(text(rb));
  left=SymDisplayGroupSum(ra);
  right=SymDisplayGroupSum(rb);
  out=left+" · "+right;
  if(SymNumber(rawleft) & SymNumber(rawright),
    out=left+"×"+right,
    (
      if(SymDisplayMono(left) & SymDisplayMono(right),
        (
          if(SymNumber(rawright) & (!SymNumber(rawleft)),
            out=right+left,
            out=left+right
          );
        ),
        (
          if(SymDisplayMono(right) & SymDisplayFunction(left),
            out=right+" "+left,
            if(SymDisplayMono(left) & SymDisplayFunction(right),
              out=left+" "+right,
              if(SymDisplayMono(left) & (substring(right,0,1)=="("),
                out=left+right,
                if(SymDisplayMono(right) & (substring(left,0,1)=="("),
                  out=right+left
                )
              )
            )
          );
        )
      );
    )
  );
  out
);

SymDisplayExpr(s):=(
  regional(t,out,k,op,a,b,at,bt,fn,inner,c,sup);
  t=SymCompact(text(s));
  out=t;
  if((length(t)>=2) & (substring(t,0,1)=="[") &
     (substring(t,length(t)-1,length(t))=="]"),
    (
      c=SymComponents(t);
      if(length(c)==3,
        out="["+SymDisplayExpr(c_1)+","+SymDisplayExpr(c_2)+","+SymDisplayExpr(c_3)+"]"
      );
    ),
    (
      t=SymUnwrap(t);
      k=SymOperator(t,"+-",false);
      if(k>0,
        (
          op=substring(t,k-1,k);
          a=substring(t,0,k-1);
          b=substring(t,k,length(t));
          at=SymDisplayExpr(a);
          bt=SymDisplayExpr(b);
          if(op=="+",
            (
              if(substring(bt,0,1)=="-",
                out=at+bt,
                out=at+"+"+bt
              );
            ),
            (
              if(SymOperator(SymUnwrap(b),"+-",false)>0,
                bt="("+bt+")"
              );
              if((substring(bt,0,1)=="-") &
                 (SymOperator(SymUnwrap(b),"+-",false)==0),
                out=at+"+"+substring(bt,1,length(bt)),
                out=at+"-"+bt
              );
            )
          );
        ),
        (
          if((length(t)>0) & (substring(t,0,1)=="-"),
            (
              b=substring(t,1,length(t));
              out="-"+SymDisplayGroupSum(b);
            ),
            (
              k=SymOperator(t,"*/",false);
              if(k>0,
                (
                  op=substring(t,k-1,k);
                  a=substring(t,0,k-1);
                  b=substring(t,k,length(t));
                  if(op=="*",
                    out=SymDisplayMul(a,b),
                    (
                      at=SymDisplayGroupSum(a);
                      bt=SymDisplayGroupSum(b);
                      if(SymOperator(SymUnwrap(b),"*/",false)>0,
                        bt="("+SymDisplayExpr(b)+")"
                      );
                      out=at+"/"+bt;
                    )
                  );
                ),
                (
                  k=SymOperator(t,"^",true);
                  if(k>0,
                    (
                      a=substring(t,0,k-1);
                      b=substring(t,k,length(t));
                      at=SymDisplayExpr(a);
                      bt=SymDisplayExpr(b);
                      if((SymOperator(SymUnwrap(a),"+-*/^",false)>0) %
                         (substring(SymUnwrap(a),0,1)=="-"),at="("+at+")");
                      if(SymOperator(SymUnwrap(b),"+-*/",false)>0,bt="("+bt+")");
                      sup=Sym64Exponent(b);
                      if(sup!="",out=at+sup,out=at+"^"+bt);
                    ),
                    (
                      k=indexof(t,"(");
                      if((k>1) & (substring(t,length(t)-1,length(t))==")"),
                        (
                          fn=substring(t,0,k-1);
                          inner=substring(t,k,length(t)-1);
                          if(fn=="sqrt",
                            out="√("+SymDisplayExpr(inner)+")",
                            out=fn+"("+SymDisplayExpr(inner)+")"
                          );
                        ),
                        (
                          if(t=="pi",out="π",out=t);
                        )
                      );
                    )
                  );
                )
              );
            )
          );
        )
      );
    )
  );
  out
);

DrawSymbolicLine(x,y,head,expr,col,maxRows):=(
  regional(t,pos,maxlen,seg,used,i,ch,breakpos);
  t=head+SymDisplayExpr(Sym64Reduce(expr));
  used=0;
  maxlen=32;
  while((length(t)>0) & (used<maxRows),
    (
      pos=min(maxlen,length(t));
      if((length(t)>maxlen) & (used<maxRows-1),
        (
          breakpos=0;
          forall(18..maxlen,i,
            (
              ch=substring(t,i-1,i);
              if(indexof("+-,]",ch)>0,breakpos=i);
            )
          );
          if(breakpos>0,pos=breakpos);
        )
      );
      seg=substring(t,0,pos);
      if((length(t)>pos) & (used==maxRows-1),
        (
          seg=substring(t,0,maxlen-3)+"...";
          t="";
        ),
        t=substring(t,pos,length(t))
      );
      drawtext([x,y-used*0.30],seg,size->11,color->col);
      used=used+1;
    )
  );
  y-0.32*used-0.14
);

CurlAt(q):=(
  regional(h,dx,dy,dz,fxp,fxm,fyp,fym,fzp,fzm);
  h=0.0001;
  fxp=InputF(q+[h,0,0]);
  fxm=InputF(q+[-h,0,0]);
  fyp=InputF(q+[0,h,0]);
  fym=InputF(q+[0,-h,0]);
  fzp=InputF(q+[0,0,h]);
  fzm=InputF(q+[0,0,-h]);
  dx=(fxp-fxm)/(2*h);
  dy=(fyp-fym)/(2*h);
  dz=(fzp-fzm)/(2*h);
  [dy_3-dz_2,dz_1-dx_3,dx_2-dy_1]
);

IsFiniteReal(v):=(
  regional(ok);
  ok=false;
  if(isreal(v),
    if((v==v) & (abs(v)<10^100),ok=true)
  );
  ok
);

IsPoint3(q):=(
  regional(ok);
  ok=false;
  if(islist(q),
    if(length(q)==3,
      ok=(length(select(q,IsFiniteReal(#)))==3)
    )
  );
  ok
);

AllowedInputChars="0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_+-*/^().,[] √";
HasUnsupportedChars(s):=(
  regional(found,ch);
  found=false;
  forall(1..length(s),
    (
      ch=substring(s,#-1,#);
      if(indexof(AllowedInputChars,ch)==0,found=true);
    )
  );
  found
);

HasZeroDivision(s):=(
  regional(found,j,ch,seenDigit,seenNonZero);
  found=false;
  forall(1..length(s),
    if(substring(s,#-1,#)=="/",
      (
        j=#+1;
        while(j<=length(s) & substring(s,j-1,j)==" ",j=j+1);
        if(j<=length(s),
          if(indexof("+-",substring(s,j-1,j))>0,j=j+1)
        );
        seenDigit=false;
        seenNonZero=false;
        while(j<=length(s) & indexof("0123456789.",substring(s,j-1,j))>0,
          (
            ch=substring(s,j-1,j);
            if(indexof("0123456789",ch)>0,seenDigit=true);
            if(indexof("123456789",ch)>0,seenNonZero=true);
            j=j+1;
          )
        );
        if(seenDigit & !seenNonZero,found=true);
      )
    )
  );
  found
);

EvalInputAt(s,q):=(
  regional(x,y,z);
  x=q_1;
  y=q_2;
  z=q_3;
  parse(s)
);

DrawMultiWheel(q,rv,ang,idx,col):=(
  regional(mag,n,helper,e1,e2,r,b,a,c,s,tip,hook,axisend,ap1,ap2);
  mag=Norm3(rv);
  if(mag>0.0001,n=rv/mag,n=[0,0,1]);
  if(abs(n_3)<0.9,helper=[0,0,1],helper=[1,0,0]);
  e1=Cross3(helper,n);
  e1=e1/Norm3(e1);
  e2=Cross3(n,e1);
  e2=e2/Norm3(e2);

  if(showAxis & (mag>0.0001),
    (
      axisend=q+1.25*n;
      ap1=axisend-0.19*n+0.11*e1;
      ap2=axisend-0.19*n-0.11*e1;
      DrawSeg3(q,axisend,[0,0,1],2.8);
      DrawSeg3(axisend,ap1,[0,0,1],2.8);
      DrawSeg3(axisend,ap2,[0,0,1],2.8);
    )
  );

  if(showWind,
    (
      r=0.83;
      b=0.30;
      forall(0..3,
        (
        a=ang+#*pi/2;
        c=cos(a);
        s=sin(a);
        tip=q+r*c*e1+r*s*e2;
        hook=q+(r*c-b*s)*e1+(r*s+b*c)*e2;
        DrawSeg3(q,tip,col,3.6);
        DrawSeg3(tip,hook,col,3.6);
        )
      );
    )
  );
  DrawPt3(q,col,6.5);
  drawtext(Proj3(q)+[0.16,-0.24],"P"+text(idx),size->13,color->col);
);

DrawMultiField(q):=(

    (
    tail=q+#;
    ff=InputF(tail);
    flen=Norm3(ff);
    if(flen>0.0001,
      (
        dir=ff/flen;
        if(abs(dir_3)<0.9,helper=[0,0,1],helper=[1,0,0]);
        side=Cross3(helper,dir);
        side=side/Norm3(side);
        head=tail+0.19*ff;

        DrawSeg3(head,base-0.06*side,[0,0.65,0],1.7);
      )
    );
    )
  );
);

    inputDivP=divPResult;

    p0=inputP;
    v0=inputRotP;
    divp=inputDivP;

    rotmag=Norm3(v0);
    speedscale=0.5;
    rotspeed=speedscale*rotmag;

            resetclock();

            mlasttime=seconds();

              if(htmlmode,playanimation(),(Anim1.speed=1;Anim1.run=true))
            );
          )
        );
        mnow=seconds();
        mdt=max(0,min(0.16,mnow-mlasttime));
        if(MotionState==1,
          mphases=apply(1..3,mphases_#+mspeeds_#*mdt)
        );
        mlasttime=mnow;
        if(!htmlmode,
          Anim1.run=(MotionState==1) & (max(mspeeds)>0.0001)
        );

            Start3d([]);

            viewphi=PHI;

        );

        FI.visible=true;
        TH.xy=[max(-4.45,min(4.45,TH.x)),-3.75];
        FI.xy=[max(-4.45,min(4.45,FI.x)),-4.35];

        draw([-4.45,-4.35],[4.45,-4.35],size->2,color->[0.35,0.35,0.35]);
        drawtext([-4.35,-3.52],"視点：上下",size->13);
        drawtext([-4.35,-4.12],"視点：左右",size->13);

        DrawSeg3([-5,0,0],[5,0,0],[0,0,0],1);
        DrawSeg3([0,-5,0],[0,5,0],[0,0,0],1);
        DrawSeg3([0,0,-5],[0,0,5],[0,0,0],1);
        drawtext(Proj3([5,0,0])+[0.12,0.08],"x",size->13);

        drawtext(Proj3([0,0,5])+[0.12,0.08],"z",size->13);

          )
        );
      ),
      (
    if(rotmag>0.0001,
      (
        n0=v0/rotmag;

        if(abs(n0_3)<0.9,
          helper=[0,0,1],
          helper=[1,0,0]
        );

        e1=Cross3(helper,n0);
        e1=e1/Norm3(e1);

        e2=Cross3(n0,e1);
        e2=e2/Norm3(e2);

        axislen=2.0;
        axisend=p0+axislen*n0;

        arrowback=0.30;
        arrowwide=0.13;
        axish1=axisend-arrowback*n0+arrowwide*e1;
        axish2=axisend-arrowback*n0-arrowwide*e1;
      ),
      (
        n0=[0,0,1];
        e1=[1,0,0];
        e2=[0,1,0];
        rotspeed=0;
        axisend=p0;
        axish1=p0;
        axish2=p0;
      )
    );

    if(htmlmode,
      (
        if(!htmlstarted,
          (
            resetclock();
            htmlphase=0;
            htmlprevtime=seconds();
            htmlprevspeed=rotspeed;
            htmlstarted=true;
            if(MotionState==1,playanimation());
          )
        );

        hnow=seconds();
        hdt=hnow-htmlprevtime;
        if(hdt<0,hdt=0);

        if(MotionState==1,
          htmlphase=htmlphase+htmlprevspeed*hdt
        );
        htmlprevtime=hnow;
        htmlprevspeed=rotspeed;

        if(rotmag>0.0001,
          (
            cc=cos(htmlphase);
            ss=sin(htmlphase);
          ),
          (
            cc=1;
            ss=0;
          )
        );
      ),
      (
        Anim1.speed=rotspeed;

        Anim1.run=(rotmag>0.0001) & (MotionState==1);

        if(rotmag>0.0001,
          (
            rr=sqrt((T.x-M.x)^2+(T.y-M.y)^2);

            if(rr>0.0001,
              (
                cc=(T.x-M.x)/rr;
                ss=(T.y-M.y)/rr;
              ),
              (
                cc=1;
                ss=0;
              )
            );
          ),
          (
            cc=1;
            ss=0;
          )
        );
      )
    );

    windR=2.7;
    windB=0.95;

    wA=p0+(windR*cc)*e1+(windR*ss)*e2;
    wB=p0+(windR*cc-windB*ss)*e1+(windR*ss+windB*cc)*e2;
    wC=p0+(-windR*ss)*e1+(windR*cc)*e2;
    wD=p0+(-windB*cc-windR*ss)*e1+(-windB*ss+windR*cc)*e2;
    wE=p0+(-windR*cc)*e1+(-windR*ss)*e2;
    wF=p0+(-windR*cc+windB*ss)*e1+(-windR*ss-windB*cc)*e2;
    wG=p0+(windR*ss)*e1+(-windR*cc)*e2;
    wH=p0+(windB*cc+windR*ss)*e1+(windB*ss-windR*cc)*e2;

    vscale=0.25;
    headback=0.16;
    headwide=0.09;

    Arr(q):=(
      ff=InputF(q);
      flen=Norm3(ff);

      if(flen>0.0001,
        (
          fdir=ff/flen;

          if(abs(fdir_3)<0.9,
            hhelp=[0,0,1],
            hhelp=[1,0,0]
          );

          side=Cross3(hhelp,fdir);
          side=side/Norm3(side);

          tt=q+vscale*ff;
          bb=tt-headback*fdir;

          [q,tt,bb+headwide*side,bb-headwide*side]
        ),
        [q,q,q,q]
      )
    );

    d=0.85;

    s1=p0+[ d, d, d];
    s2=p0+[-d, d, d];
    s3=p0+[-d,-d, d];
    s4=p0+[ d,-d, d];
    s5=p0+[ d, d,-d];
    s6=p0+[-d, d,-d];
    s7=p0+[-d,-d,-d];
    s8=p0+[ d,-d,-d];

    a1=Arr(s1);
    a2=Arr(s2);
    a3=Arr(s3);
    a4=Arr(s4);
    a5=Arr(s5);
    a6=Arr(s6);
    a7=Arr(s7);
    a8=Arr(s8);

    if(!htmlmode,
      (
        Start3d([]);

        TH.xy=[TH.x,-3.75];
        FI.xy=[FI.x,-4.35];
        TH.visible=true;
        FI.visible=true;

        draw([-4.45,-3.75],[4.45,-3.75],size->2,color->[0.35,0.35,0.35]);
        draw([-4.45,-4.35],[4.45,-4.35],size->2,color->[0.35,0.35,0.35]);
        drawtext([-4.35,-3.52],"視点：上下",size->13);
        drawtext([-4.35,-4.12],"視点：左右",size->13);

        Parapt(pt):=(
          regional(Xz,Yz);
          Xz=-pt_1*sin(PHI)+pt_2*cos(PHI);
          Yz=-pt_1*cos(PHI)*cos(THETA)-pt_2*sin(PHI)*cos(THETA)+pt_3*sin(THETA);
          [Xz+2.35,Yz+0.15]
        );

        Pointdata3d("O",[0,0,0],["nodisp"]);
        Xyzax3data("","x=[-5,5]","y=[-5,5]","z=[-5,5]");
        Pointdata3d("P",p0,["Size=3","Color=magenta"]);

        if(showAxis & (rotmag>0.0001),
          (
            Pointdata3d("Q",axisend,["nodisp"]);
            Pointdata3d("Q1",axish1,["nodisp"]);
            Pointdata3d("Q2",axish2,["nodisp"]);

            Spaceline("0",[P3d,Q3d],["Color=blue","dr,2"]);
            Spaceline("01",[Q3d,Q13d],["Color=blue","dr,2"]);
            Spaceline("02",[Q3d,Q23d],["Color=blue","dr,2"]);
          )
        );

        if(showWind,
          (
            Pointdata3d("WA",wA,["nodisp"]);
            Pointdata3d("WB",wB,["nodisp"]);
            Pointdata3d("WC",wC,["nodisp"]);
            Pointdata3d("WD",wD,["nodisp"]);
            Pointdata3d("WE",wE,["nodisp"]);
            Pointdata3d("WF",wF,["nodisp"]);
            Pointdata3d("WG",wG,["nodisp"]);
            Pointdata3d("WH",wH,["nodisp"]);

            Spaceline("1",[P3d,WA3d,WB3d],["Color=red","dr,3"]);
            Spaceline("2",[P3d,WC3d,WD3d],["Color=red","dr,3"]);
            Spaceline("3",[P3d,WE3d,WF3d],["Color=red","dr,3"]);
            Spaceline("4",[P3d,WG3d,WH3d],["Color=red","dr,3"]);
          )
        );

        if(showField,
          (
            Spaceline("11",[a1_1,a1_2],["Color=green"]);
            Spaceline("12",[a1_2,a1_3],["Color=green"]);
            Spaceline("13",[a1_2,a1_4],["Color=green"]);
            Spaceline("14",[a2_1,a2_2],["Color=green"]);
            Spaceline("15",[a2_2,a2_3],["Color=green"]);
            Spaceline("16",[a2_2,a2_4],["Color=green"]);
            Spaceline("17",[a3_1,a3_2],["Color=green"]);
            Spaceline("18",[a3_2,a3_3],["Color=green"]);
            Spaceline("19",[a3_2,a3_4],["Color=green"]);
            Spaceline("20",[a4_1,a4_2],["Color=green"]);
            Spaceline("21",[a4_2,a4_3],["Color=green"]);
            Spaceline("22",[a4_2,a_4],["Color=green"]);
            Spaceline("23",[a5_1,a5_2],["Color=green"]);
            Spaceline("24",[a5_2,a5_3],["Color=green"]);
            Spaceline("25",[a5_2,a5_4],["Color=green"]);
            Spaceline("26",[a6_1,a6_2],["Color=green"]);
            Spaceline("27",[a6_2,a6_3],["Color=green"]);
            Spaceline("28",[a6_2,a6_4],["Color=green"]);
            Spaceline("29",[a7_1,a7_2],["Color=green"]);
            Spaceline("30",[a7_2,a7_3],["Color=green"]);
            Spaceline("31",[a7_2,a7_4],["Color=green"]);
            Spaceline("32",[a8_1,a8_2],["Color=green"]);
            Spaceline("33",[a8_2,a8_3],["Color=green"]);
            Spaceline("34",[a8_2,a8_4],["Color=green"]);
          )
        );

        Windispg();

        SW.visible=false;
        NE.visible=false;
        LB.visible=false;
        M.visible=false;
        N.visible=false;
        T.visible=false;
        A.visible=false;
      ),
      (
        TH.visible=true;
        FI.visible=true;
        LB.visible=false;
        SW.visible=false;
        NE.visible=false;
        M.visible=false;
        N.visible=false;
        T.visible=false;
        A.visible=false;

        draw([-4.45,-3.75],[4.45,-3.75],size->2,color->[0.35,0.35,0.35]);
        draw([-4.45,-4.35],[4.45,-4.35],size->2,color->[0.35,0.35,0.35]);
        drawtext([-4.35,-3.52],"視点：上下 ("+text(round(viewthdegree))+"°)",size->13);
        drawtext([-4.35,-4.12],"視点：左右 ("+text(round(viewfidegree))+"°)",size->13);

        DrawSeg3([-5,0,0],[5,0,0],[0,0,0],1);
        DrawSeg3([0,-5,0],[0,5,0],[0,0,0],1);
        DrawSeg3([0,0,-5],[0,0,5],[0,0,0],1);

        drawtext(Proj3([5,0,0])+[0.12,0.08],"x",size->13);
        drawtext(Proj3([0,5,0])+[0.12,0.08],"y",size->13);
        drawtext(Proj3([0,0,5])+[0.12,0.08],"z",size->13);

        DrawPt3(p0,[1,0,1],7);

        if(showAxis & (rotmag>0.0001),
          (
            DrawSeg3(p0,axisend,[0,0,1],3);
            DrawSeg3(axisend,axish1,[0,0,1],3);
            DrawSeg3(axisend,axish2,[0,0,1],3);
          )
        );

        if(showWind,
          (
            DrawSeg3(p0,wA,[1,0,0],4);
            DrawSeg3(wA,wB,[1,0,0],4);
            DrawSeg3(p0,wC,[1,0,0],4);
            DrawSeg3(wC,wD,[1,0,0],4);
            DrawSeg3(p0,wE,[1,0,0],4);
            DrawSeg3(wE,wF,[1,0,0],4);
            DrawSeg3(p0,wG,[1,0,0],4);
            DrawSeg3(wG,wH,[1,0,0],4);
          )
        );

        if(showField,
          (
            DrawSeg3(a1_1,a1_2,[0,0.7,0],2);
            DrawSeg3(a1_2,a1_3,[0,0.7,0],2);
            DrawSeg3(a1_2,a1_4,[0,0.7,0],2);
            DrawSeg3(a2_1,a2_2,[0,0.7,0],2);
            DrawSeg3(a2_2,a2_3,[0,0.7,0],2);
            DrawSeg3(a2_2,a2_4,[0,0.7,0],2);
            DrawSeg3(a3_1,a3_2,[0,0.7,0],2);
            DrawSeg3(a3_2,a3_3,[0,0.7,0],2);
            DrawSeg3(a3_2,a3_4,[0,0.7,0],2);
            DrawSeg3(a4_1,a4_2,[0,0.7,0],2);
            DrawSeg3(a4_2,a4_3,[0,0.7,0],2);
            DrawSeg3(a4_2,a4_4,[0,0.7,0],2);
            DrawSeg3(a5_1,a5_2,[0,0.7,0],2);
            DrawSeg3(a5_2,a5_3,[0,0.7,0],2);
            DrawSeg3(a5_2,a5_4,[0,0.7,0],2);
            DrawSeg3(a6_1,a6_2,[0,0.7,0],2);
            DrawSeg3(a6_2,a6_3,[0,0.7,0],2);
            DrawSeg3(a6_2,a6_4,[0,0.7,0],2);
            DrawSeg3(a7_1,a7_2,[0,0.7,0],2);
            DrawSeg3(a7_2,a7_3,[0,0.7,0],2);
            DrawSeg3(a7_2,a7_4,[0,0.7,0],2);
            DrawSeg3(a8_1,a8_2,[0,0.7,0],2);
            DrawSeg3(a8_2,a8_3,[0,0.7,0],2);
            DrawSeg3(a8_2,a8_4,[0,0.7,0],2);
          )
        );
      )
    );
      ) // showMulti=FALSE：従来の1点表示ここまで
    );

    if(InputHelpOpen,
      DrawInputHelp(),
      if(showMulti,
      (
        resultx=8.25;
        resulty=4.35;
        drawtext([resultx,resulty],"3-point comparison",size->17);
        resulty=resulty-0.60;
        if(divResult!="",
          (
            resulty=DrawSymbolicLine(resultx,resulty,"div F(x,y,z) = ",divResult,[0.10,0.22,0.58],1);
            resulty=DrawSymbolicLine(resultx,resulty,"rot F(x,y,z) = ",rotResult,[0.10,0.22,0.58],2);
          ),
          (
            drawtext([resultx,resulty],"厳密式：この入力形式には未対応",size->11,color->[0.60,0.32,0.12]);
            drawtext([resultx,resulty-0.27],substring(SymbolicDebug,0,min(length(SymbolicDebug),55)),size->8,color->[0.53,0.37,0.18]);
            resulty=resulty-0.48;
          )
        );
        forall(1..3,
          (
          mi=#;
          drawtext([resultx,resulty],"P"+text(mi)+" = "+text(mpcalc_mi),size->13,color->mcolors_mi);
          resulty=resulty-0.38;
          if(showInfo,
            (
              drawtext([resultx,resulty],"rot = "+text(apply(mrots_mi,round(#*1000)/1000))+"   |rot| = "+text(round(mmags_mi*1000)/1000),size->12);
              resulty=resulty-0.48;
            )
          );
          if(showMeter,
            (
              mbarx=resultx+0.4;
              mbarlen=3.3;
              mbarfrac=min(1,mspeeds_mi/5);
              draw([mbarx,resulty],[mbarx+mbarlen,resulty],size->2,color->[0.72,0.72,0.72]);
              draw([mbarx,resulty],[mbarx+mbarlen*mbarfrac,resulty],size->5,color->mcolors_mi);
              drawtext([mbarx+mbarlen+0.2,resulty-0.08],text(round(mspeeds_mi*100)/100),size->11);
              resulty=resulty-0.45;
            )
          );
          resulty=resulty-0.17;
          )
        );
        drawtext([8.35,-3.05],"風車の速さ = 0.5 × |rot F(Pi)|",size->12);
        drawtext([8.35,-3.48],"青：rot軸　 緑：ベクトル場",size->12);
      ),
      (
    resultx=8.25;
    resulty=4.35;

    drawtext([resultx,resulty],"Calculation Result",size->17);
    resulty=resulty-0.65;

    if(divResult!="",
      (
        resulty=DrawSymbolicLine(resultx,resulty,"div F(x,y,z) = ",divResult,[0.10,0.22,0.58],2);
        resulty=DrawSymbolicLine(resultx,resulty,"rot F(x,y,z) = ",rotResult,[0.10,0.22,0.58],3);
      ),
      (
        drawtext([resultx,resulty],"厳密式：この入力形式には未対応",size->11,color->[0.60,0.32,0.12]);
            drawtext([resultx,resulty-0.27],substring(SymbolicDebug,0,min(length(SymbolicDebug),55)),size->8,color->[0.53,0.37,0.18]);
        resulty=resulty-0.48;
      )
    );
    drawtext([resultx,resulty],"指定点での数値計算（近似）",size->12,color->[0.35,0.35,0.35]);
    resulty=resulty-0.41;

    drawtext([resultx,resulty],"div F(P) = "+divPResult,size->14);
    resulty=resulty-0.55;

    drawtext([resultx,resulty],"rot F(P) = "+rotPResult,size->14);
    resulty=resulty-0.55;

    if(showInfo,
      (
        drawtext([resultx,resulty],"|rot F(P)| = "+text(rotmag),size->14);
        resulty=resulty-0.55;

        drawtext([resultx,resulty],"Rotation speed = "+text(rotspeed),size->14);
        resulty=resulty-0.55;

        if(rotmag<=0.0001,
          drawtext([resultx,resulty],"rot F(P) = 0 : Windmill stopped",size->13,color->[1,0,0])
        );
      )
    );

    if(showMeter,
      (
        metermax=5;
        meterratio=rotspeed/metermax;

        if(meterratio>1,meterratio=1);
        if(meterratio<0,meterratio=0);

        meterx=12.55;
        metery0=-2.5;
        meterh=5;
        metery=metery0+meterh*meterratio;

        draw([meterx,metery0],[meterx,metery0+meterh],size->2,color->[0,0,1]);
        draw([meterx,metery0],[meterx,metery],size->8,color->[0,0,1]);

        forall(0..5,
          draw(
            [meterx-0.2,metery0+meterh*#/5],
            [meterx+0.2,metery0+meterh*#/5],
            size->2,
            color->[0,0,1]
          );
          drawtext([meterx+0.3,metery0+meterh*#/5],text(#),size->11);
        );

        drawtext([meterx-0.95,metery0+meterh+0.45],"Rotation speed",size->13);
        drawtext([meterx-0.20,metery0+meterh+0.10],text(rotspeed),size->12);
      )
    );

    legendx=14.15;
    legendy=2.20;

    drawtext([legendx,legendy],"Legend",size->14);

    draw([legendx,legendy-0.55],[legendx+0.65,legendy-0.55],size->4,color->[1,0,0]);
    drawtext([legendx+0.8,legendy-0.55],"Windmill",size->12);

    draw([legendx,legendy-1.05],[legendx+0.65,legendy-1.05],size->4,color->[0,0,1]);
    drawtext([legendx+0.8,legendy-1.05],"rot axis",size->12);

    draw([legendx,legendy-1.55],[legendx+0.65,legendy-1.55],size->4,color->[0,0.7,0]);
    drawtext([legendx+0.8,legendy-1.55],"Vector field",size->12);

    draw([legendx,legendy-2.05],size->6,color->[1,0,1]);
    drawtext([legendx+0.8,legendy-2.05],"Point P",size->12);
      )
      )
    );
  ),
  (
    if(InputHelpOpen,
      DrawInputHelp(),
      drawtext([3.15,1.1],"P と F を入力して「計算」を押してください",size->17)
    );
  )
);

;

</script>
